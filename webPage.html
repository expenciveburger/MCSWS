<!DOCTYPE html>
<html lang="en">
    <head>
        <title>MCSWS</title>                                                                                                                        <!--   Set webpage title  -->
        <link rel="icon" type="image/x-icon" href="pictures/Untitled.png">                                                                          <!--       Set icon       -->
        <link rel="stylesheet" href="styles.css">                                                                                                   <!--      Connect CSS     -->
        <link rel="preconnect" href="https://fonts.googleapis.com">                                                             <!-- Connect fonts "Source Code Pro", "Saira" -->      
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>                                                    <!-- Connect fonts "Source Code Pro", "Saira" --> 
        <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <meta charset="utf-8">                                                                                                                      <!--         Meta         -->
        <meta name="author" content="expenciveburger">                                                                                              <!--         Meta         -->
        <meta name="description" content="Minecraft Server Website">                                                                                <!--         Meta         -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">                                                                      <!--         Meta         -->
    </head>
    <body class="background_color-background">
        <main>
            <header class="width-100 height-2 top-1 left-0 position-fixed">                                                                         <!--     Header start      -->
                <div class="width-inherit height-inherit display-flex justify-content-center align-items-center position-relative">                 <!--     Header setup      -->
                    <div class="width-80 height-inherit display-grid header-grid position-relative">                                                <!--     Header grid       -->
                        <div class="width-100 height-100 display-flex justify-content-center align-items-center position-relative"></div>           <!--     Header slot 1     -->
                        <div class="width-100 height-100 display-flex justify-content-center align-items-center position-relative">                 <!--     Header slot 2     -->

                                <div class="width-inherit height-inherit border-radius-inherit position-absolute background_color-accent"></div>    <!--   Background color    -->
                                <div class="width-inherit height-inherit border-radius-inherit position-absolute text_font-source-code-pro text_font-size-2 text_align-center">
                                    <div class="padding-1">Burgercraft</div>                                                                        <!--         Text          -->
                                </div>                                                                                                          
                                <div class="width-inherit height-inherit border-radius-inherit position-absolute element-blur border-1"></div>      <!--         Blur          -->
                                <div class="width-inherit height-inherit border-radius-inherit position-absolute cute-box-shadow"></div>            <!--      Cute shadow      -->
                            </div>
                        </div>                                                                                                                      <!--   Header slot 2 end   -->
                        <div class="width-100 height-100 display-flex justify-content-center align-items-center position-relative"></div>           <!--     Header slot 3     -->
                    </div>
                </div>
            </header>                                                                                                                               <!--       Header end      -->

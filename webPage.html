<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Set webpage title -->

        <title>MCSWS</title>

        <!-- Set icon -->
         
        <link rel="icon" type="image/x-icon" href="pictures/Untitled.png">

        <!-- Connect CSS -->

        <link rel="stylesheet" href="styles.css">

        <!-- Connect fonts "Source Code Pro", "Saira" -->

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

        <!-- Meta -->

        <meta charset="utf-8">
        <meta name="author" content="expenciveburger">
        <meta name="description" content="Minecraft Server Website">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <main>

            <!-- Burgercraft Logo start -->

            <div class="burgercraft-logo">

                <!-- Burgercraft Logo Fixed start -->

                <div class="card-burgercraft-fixed__setup">
                    <div class="card-burgercraft">
                        <div class="card-burgercraft__border"></div>
                        <div class="card-burgercraft__glow">
                            <div class="card-burgercraft__glow-big"></div>
                            <div class="card-burgercraft__glow-small"></div>
                        </div>
                        <p class="card-burgercraft__text">
                            BURGERCRAFT
                        </p>
                        <div class="card-burgercraft__blur"></div>
                    </div>
                </div>

                <!-- Burgercraft Logo Fixed end -->

                <!-- Burgercraft Logo Hero start -->

                <div class="card-burgercraft-hero__setup">
                    <div class="card-burgercraft">
                        <div class="card-burgercraft__border"></div>
                        <div class="card-burgercraft__glow">
                            <div class="card-burgercraft__glow-big"></div>
                            <div class="card-burgercraft__glow-small"></div>
                        </div>
                        <p class="card-burgercraft__text">
                            BURGERCRAFT
                        </p>
                        <div class="card-burgercraft__blur"></div>
                    </div>
                </div>

                <!-- Burgercraft Logo Hero end -->

            </div>

            <!-- Burgercraft Logo end -->

            <!-- Login And Signin Buttons start -->

            <div class="login-signin-buttons">

                <!-- Login Button start -->

                <div class="login-signin-buttons__login-setup">
                    <div class="login-signin-buttons-login">
                        <div class="login-signin-buttons__login-border"></div>
                        <div class="login-signin-buttons__login-glow">
                            <div class="login-signin-buttons__login-glow-big"></div>
                            <div class="login-signin-buttons__login-glow-small"></div>
                        </div>
                        <p class="login-signin-buttons__login-text">
                            BURGERCRAFT
                        </p>
                        <div class="login-signin-buttons__login-blur"></div>
                    </div>
                </div>

                <!-- Login Button end -->

                <!-- Signin Button start -->

                <div class="login-signin-buttons__signin-setup">
                    <div class="login-signin-buttons__signin">
                        <div class="login-signin-buttons__signin-boderr"></div>
                        <div class="login-signin-buttons__signin-glow">
                            <div class="login-signin-buttons__signin-glow-big"></div>
                            <div class="login-signin-buttons__signin-glow-small"></div>
                        </div>
                        <p class="login-signin-buttons__signin-text">
                            BURGERCRAFT
                        </p>
                        <div class="card-burgercraft__blur"></div>
                    </div>
                </div>

                <!-- Signin Button end -->

            </div>

            <!-- Login And Signin Buttons end -->
        </main>
    </body>
</html>

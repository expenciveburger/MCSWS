<!DOCTYPE html>
<html lang="en">
    <head>
                                                                                                     <!-- Set webpage title -->

        <title>MCSWS</title>

                                                                                                     <!-- Set icon -->
         
        <link rel="icon" type="image/x-icon" href="pictures/Untitled.png">

                                                                                                     <!-- Connect CSS -->

        <link rel="stylesheet" href="styles.css">

                                                                                                     <!-- Connect fonts "Source Code Pro", "Saira" -->

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

                                                                                                     <!-- Meta -->

        <meta charset="utf-8">
        <meta name="author" content="expenciveburger">
        <meta name="description" content="Minecraft Server Website">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <main>

                                                                                                     <!-- Header start -->

            <header class="width-100 display-flex justify-content-center align-items-center position-fixed">
                <div class="burgercraft-logo-fixed"></div>
                    <div class="card-burgercraft-fixed__setup animation-timeline display-flex transform-origin-center-center">
                        <div class="card-burgercraft element-hover-animation cute-box-shadow display-flex justify-content-center align-items-center height-inherit width-inherit">
                            <div class="card-burgercraft__border display-flex justify-content-center align-items-center position-absolute"></div>
                            <div class="card-burgercraft_glow position-absolute height-inherit width-inherit">
                                <div class="card-burgercraft_glow-big glow-animation-big position-absolute height-inherit width-inherit"></div>
                                <div class="card-burgercraft_glow-small glow-animation-small position-absolute height-inherit width-inherit"></div>
                            </div>
                            <p class="card-burgercraft__text position-absolute">
                                BURGERCRAFT
                            </p>
                            <div class="card-burgercraft__blur element-blur position-relative"></div>
                        </div>
                    </div>
                </div>
            </header>

                                                                                                     <!-- Header end -->

                                                                                                     <!-- Burgercraft Logo Hero start -->
            
            <div class="width-100 display-flex justify-content-center burgercraft-hero">
                <div class="card-burgercraft-hero__setup animation-timeline display-flex transform-origin-center-center">
                    <div class="card-burgercraft element-hover-animation cute-box-shadow display-flex justify-content-center align-items-center height-inherit width-inherit">
                        <div class="card-burgercraft__border display-flex justify-content-center position-absolute"></div>
                        <div class="card-burgercraft_glow position-absolute height-inherit width-inherit">
                            <div class="card-burgercraft_glow-big glow-animation-big position-absolute height-inherit width-inherit"></div>
                            <div class="card-burgercraft_glow-small glow-animation-small position-absolute height-inherit width-inherit"></div>
                        </div>
                        <p class="card-burgercraft__text position-absolute">
                            BURGERCRAFT
                        </p>
                        <div class="card-burgercraft__blur element-blur position-relative"></div>
                    </div>
                </div>
            </div>

                                                                                                      <!-- Burgercraft Logo Hero end -->

                                                                                                      <!-- Burgercraft Logo end -->

            <div class="height-1000"></div>

                                                                                                     <!-- Log in And Sign in start -->

            <div class="login-signin-animation width-100 height-2 display-flex justify-content-center align-items-center position-relative scroll-fix"> 
                <div class="width-2 height-2 border-radius-6 element-hover-animation">                                                          <!--      Log in     -->
                    <div class="background-accent width-inherit height-inherit border-radius-inherit position-absolute"></div>                  <!--    Background   -->
                    <div class="glow-animation-small width-inherit height-inherit border-radius-inherit position-absolute"></div>               <!--       Glow      -->
                    <div class="glow-animation-big width-inherit height-inherit border-radius-inherit position-absolute"></div>                 <!--       Glow      -->
                    <div class="display-flex justify-content-center align-items-center width-inherit height-inherit border-radius-inherit position-absolute">
                        <p class="font-source-code-pro font-size-2 position-absolute">Log in</p>                                                <!--       Text      -->
                    </div>
                    <div class="element-blur width-inherit height-inherit border-radius-inherit position-absolute"></div>                       <!--       Blur      -->
                    <div class="border-3 width-inherit height-inherit border-radius-inherit position-absolute"></div>                           <!--      Border     -->
                    <div class="cute-box-shadow width-inherit height-inherit border-radius-inherit position-absolute"></div>                    <!-- Cute box shadow -->
                </div>
                <div class="width-2 height-2 border-radius-6 element-hover-animation">                                                          <!--     Sign in     -->
                    <div class="background-accent width-inherit height-inherit border-radius-inherit position-absolute"></div>                  <!--    Background   -->
                    <div class="glow-animation-small width-inherit height-inherit border-radius-inherit position-absolute"></div>               <!--       Glow      -->
                    <div class="glow-animation-big width-inherit height-inherit border-radius-inherit position-absolute"></div>                 <!--       Glow      -->
                    <div class="display-flex justify-content-center align-items-center width-inherit height-inherit border-radius-inherit position-absolute">
                        <p class="font-source-code-pro font-size-2 position-absolute">Sign in</p>                                               <!--       Text      -->
                    </div>
                    <div class="element-blur width-inherit height-inherit border-radius-inherit position-absolute"></div>                       <!--       Blur      -->
                    <div class="border-3 width-inherit height-inherit border-radius-inherit position-absolute"></div>                           <!--      Border     -->
                    <div class="cute-box-shadow width-inherit height-inherit border-radius-inherit position-absolute"></div>                    <!-- Cute box shadow -->
                </div>
            </div>

                                                                                                      <!-- Log in And Sign in end -->

        </main>
    </body>
</html>
